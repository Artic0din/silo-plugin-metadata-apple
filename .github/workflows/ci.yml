name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Reject local dependency replacements
        run: |
          if go mod edit -json | jq -e '.Replace[]? | select(.New.Version == null or .New.Version == "")' >/dev/null; then
            echo "Committed dependencies must resolve published module versions."
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Inspect manifest
        run: go run . manifest >/dev/null
